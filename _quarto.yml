        \newcommand{\GLV}[1]{\operatorname{GL}(#1)}
        \newcommand{\SLV}[1]{\operatorname{SL}(#1)}
        \newcommand{\GL}[2]{\operatorname{GL}(#1,#2)}
        \newcommand{\SL}[2]{\operatorname{SL}(#1,#2)}
        \newcommand{\lxor}{\dot\lor}
        \newcommand{\cond}{\Rightarrow}
        \newcommand{\bicond}{\Leftrightarrow}
        \newcommand{\mdc}[2]{\operatorname{mdc}(#1,#2)}
        \newcommand{\grau}[1]{\operatorname{grau}(#1)}
        \newcommand{\real}[1]{\mathfrak R(#1)}
        \newcommand{\imag}[1]{\mathfrak I(#1)}
        \newcommand{\argz}[1]{\mbox{arg}(#1)}
        \DeclareMathOperator{\sen}{sen}
        \newcommand{\cis}[1]{\cos #1+i\sen #1}
