        \newcommand{\aut}[1]{\textrm{Aut}(#1)}
        \newcommand{\fix}[1]{\textrm{Fix}(#1)}
        \newcommand{\gal}[2]{\textrm{Gal}(#1:#2)}
        \newcommand{\overbar}[1]{\mkern 1.5mu\overline{\mkern-1.5mu#1\mkern-1.5mu}\mkern 1.5mu}
